name: inkcanvas_app
description: A OneNote-style notebook app with an infinite zoomable canvas for pen, text, images, and shapes.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management (ChangeNotifier-based; no code generation required)
  provider: ^6.1.2

  # Local file system paths for on-device JSON storage
  path_provider: ^2.1.3

  # Cross-platform (Windows + Android) file picking for image insertion
  file_picker: ^13.0.0

  # Reads images off the system clipboard (Ctrl+V paste-to-insert on Windows)
  pasteboard: ^0.5.0

  # Bundled cross-platform text fonts for text boxes, so a chosen font
  # renders identically on Windows and Android instead of depending on
  # whatever's installed on the OS
  google_fonts: ^6.2.1

  # Stable unique IDs for notebooks/sections/pages/canvas elements
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
