name: inkcanvas_app
description: A OneNote-style notebook app with an infinite zoomable canvas for pen, text, images, and shapes.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management (ChangeNotifier-based; no code generation required)
  provider: ^6.1.2

  # Local file system paths for on-device JSON storage
  path_provider: ^2.1.3

  # Cross-platform (Windows + Android) file picking for image insertion
  file_picker: ^13.0.0

  # Reads images off the system clipboard (Ctrl+V paste-to-insert on Windows)
  pasteboard: ^0.5.0

  # Bundled cross-platform text fonts for text boxes, so a chosen font
  # renders identically on Windows and Android instead of depending on
  # whatever's installed on the OS
  google_fonts: ^6.2.1

  # Stable unique IDs for notebooks/sections/pages/canvas elements
  uuid: ^4.4.0

  # Real device manufacturer/model (Android) for a sensible default sync
  # device name, instead of a generic "Android device" placeholder - see
  # DeviceIdentity._defaultName()
  device_info_plus: ^13.2.0

  # Content-hashes imported image bytes so re-inserting the exact same
  # picture reuses the file already on disk instead of writing another
  # copy (see LocalStore.importImageBytes) - already pulled in
  # transitively by other packages, declared directly since our own
  # code now imports it.
  crypto: ^3.0.3

  # Opens a tapped hyperlink (auto-detected in note text - see
  # lib/canvas/link_detection.dart) in the system browser/app on
  # Windows and Android.
  url_launcher: ^6.3.0

  # Opens a tapped LOCAL file reference (a "file://" link, or a plain
  # Windows/UNC/POSIX path someone typed - see lib/canvas/link_detection.dart)
  # with whatever app the OS has for it. url_launcher can't do this
  # reliably on Android - it throws FileUriExposedException handing a
  # bare file:// URI to another app via an intent - this package
  # routes it through a FileProvider/content:// URI instead.
  open_file: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates the Windows .ico and Android launcher-icon/adaptive-icon
  # assets from assets/icon/*.png below - run with:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

  # Generates the native (pre-Flutter-engine) Android splash screen from
  # the same artwork - run with:
  #   dart run flutter_native_splash:create
  # (Windows desktop has no native pre-engine splash hook; see
  # lib/ui/splash_screen.dart for the in-app splash shown there instead.)
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon_foreground.png

# --- flutter_launcher_icons config: `dart run flutter_launcher_icons` ---
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F4ECD8"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

# --- flutter_native_splash config: `dart run flutter_native_splash:create` ---
# (Android/iOS/web only - see the comment on the dependency above.)
flutter_native_splash:
  color: "#F4ECD8"
  image: "assets/icon/app_icon_foreground.png"
  android_12:
    color: "#F4ECD8"
    image: "assets/icon/app_icon_foreground.png"
